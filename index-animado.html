<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Richard Avila - Video & Photography</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Playfair Display para el estilo Serif elegante (Angel Nin) e Inter para los párrafos -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        /* === RESET === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            /* Scroll fluido (gsap se encargará de gran parte, pero esto ayuda al feeling general) */
            scroll-behavior: smooth;
        }

        a {
            color: #fff;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        a:hover {
            opacity: 0.6;
        }

        /* === HEADER / NAV === */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            mix-blend-mode: difference;
            /* Asegura contraste si el video es blanco */
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo span {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: 5px;
            text-transform: none;
            color: rgba(255, 255, 255, 0.7);
        }

        .social-links {
            display: flex;
            gap: 20px;
        }

        .social-links svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* === SECCIONES DE SCROLL === */
        /* Eliminamos el mandatory snap nativo para dejar que GSAP controle mejor el flujo si cruzamos secciones */

        section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Overlay para legibilidad del texto */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
            transition: background 0.5s ease;
        }

        /* Contenedor del video fijo que simulará parallax o se oscurecerá */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Asegurar que el video cubra todo */
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.05);
            /* Pequeño margen para animaciones */
        }

        /* Contenido de texto central */
        .content {
            position: relative;
            z-index: 3;
            text-align: center;
            /* Ocultamos el texto inicialmente para que GSAP lo revele */
            opacity: 0;
            transform: translateY(40px);
        }

        .content h1,
        .content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 5vw;
            /* Escala con la pantalla */
            font-weight: 400;
            line-height: 1;
            letter-spacing: -2px;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .content.hero-text h1 {
            font-size: 7vw;
            text-transform: uppercase;
        }

        .content p {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Pequeña animación de scroll (ratón) en la primera sección */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0) translateX(-50%);
            }

            40% {
                transform: translateY(-10px) translateX(-50%);
            }

            60% {
                transform: translateY(-5px) translateX(-50%);
            }
        }

        /* Responsive fonts */
        @media (max-width: 768px) {
            .content.hero-text h1 {
                font-size: 12vw;
            }

            .content h2 {
                font-size: 10vw;
                letter-spacing: -1px;
            }

            nav {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

        </a>
        <div class="social-links">

        </div>
    </nav>

    <!-- SECCIÓN 1: HERO (NOMBRE) -->
    <section id="hero" class="anim-section">
        <div class="overlay"></div>
        <div class="video-container">
            <!-- Usamos el video de retratos como fondo del inicio u otro que prefieras -->
            <video autoplay playsinline muted loop>
                <source src="assets/img/bg-masthead.jpg" type="video/mp4">
            </video>
        </div>
        <div class="content hero-text">
            <h1>Richard Avila</h1>
            <p>Video & Photography</p>
        </div>
        <div class="scroll-indicator">Scroll</div>
    </section>

    <!-- SECCIÓN 2: VIDEO DRONE -->
    <section id="drone" class="anim-section">
        <div class="overlay"></div>
        <div class="video-container">
            <video autoplay playsinline muted loop>
                <source src="assets/img/portfolio/Video/Portafolio-Drone.mp4" type="video/mp4">
            </video>
        </div>
        <div class="content">
            <h2>Video Drone</h2>
            <p>Perspectivas elevadas y movimiento cinematográfico.</p>
        </div>
    </section>

    <!-- SECCIÓN 3: RETRATOS -->
    <section id="retratos" class="anim-section">
        <div class="overlay"></div>
        <div class="video-container">
            <video autoplay playsinline muted loop>
                <!-- Ojo: aquí idealmente iría otro video, reutilizo Retratos para cumplir la estructura -->
                <source src="assets/img/portfolio/Video/Retratos.mp4" type="video/mp4">
            </video>
        </div>
        <div class="content">
            <h2>Retrato Profesional</h2>
            <p>Iluminación de precisión para identidades de marca y ejecutivos.</p>
        </div>
    </section>

    <!-- GSAP Scrips -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // Aseguramos que los videos corran (Autoplay policy)
        document.addEventListener("DOMContentLoaded", () => {
            const videos = document.querySelectorAll('video');
            videos.forEach(v => { v.play().catch(e => console.log(e)); });
        });

        // GSAP Animations
        gsap.registerPlugin(ScrollTrigger);

        // 1. Animación Inicial (Hero)
        window.onload = () => {
            gsap.to("#hero .content", {
                y: 0,
                opacity: 1,
                duration: 1.5,
                ease: "power3.out",
                delay: 0.2
            });
            // Pequeño zoom out del video al cargar
            gsap.fromTo("#hero .video-container video",
                { scale: 1.1 },
                { scale: 1.05, duration: 2, ease: "power2.out" }
            );
        };

        // 2. Animaciones al hacer scroll (para todas las secciones)
        const sections = document.querySelectorAll(".anim-section");

        sections.forEach((sec, i) => {
            if (i === 0) return; // Saltamos el hero, ya animado

            // El texto aparece desplazándose hacia arriba suavemente
            gsap.to(sec.querySelector(".content"), {
                scrollTrigger: {
                    trigger: sec,
                    start: "top 60%", // Inicia cuando la sección toca el 60% de la pantalla hacia abajo
                    toggleActions: "play none none reverse"
                },
                y: 0,
                opacity: 1,
                duration: 1.2,
                ease: "power3.out"
            });

            // Pequeño efecto paralaje / scale en el video al entrar
            gsap.from(sec.querySelector(".video-container video"), {
                scrollTrigger: {
                    trigger: sec,
                    start: "top bottom",
                    end: "bottom top",
                    scrub: true
                },
                y: -50, // Parallax sutil
                ease: "none"
            });
        });
    </script>
